<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1264" width="1000" height="1264" role="img" aria-label="Lost Children Charity Platform end-to-end flowchart. Today any HTTP client drives the API; the planned Android app (Retrofit, Room and Maps declared in Gradle, no Kotlin files, API_BASE_URL set to localhost:3000/api) and the planned web dashboard (Tailwind config only, no page.tsx or layout.tsx) have no code. Requests reach four Next.js 14 route handlers in web/src/app/api: GET /api/locations (optional ?overdue=true, no body and no Zod schema), POST /api/locations, POST /api/locations/:id/mark-changed and POST /api/routes/optimize. Each POST body is parsed by its Zod schema, and a failed parse returns 400: createLocationSchema (name, address, lat within ±90 and lng within ±180, all required), markBoxChangeSchema (every field optional) and optimizeRouteSchema (currentLocation plus at least one location id, returnToStart defaults to true). The handlers call LocationController: getAllLocations or getOverdueLocations, createLocation, markBoxesChanged, and getLocationById once per id in parallel; 5 of its 9 methods are reached by a route, while updateLocation, deleteLocation, batchMarkBoxesChanged and getLocationAnalytics are not. The controller uses utils.ts (calculateElapsedDays for days and status on each row, under 7 days fresh, otherwise overdue; isValidCoordinates on create) and queries PostgreSQL through the PrismaClient singleton from db.ts that each route file passes in: findMany, findUnique, create and update on locations, which holds the lastBoxChange timer and the isActive soft-delete flag, and create on box_changes, the append-only history written in the same transaction as the timer reset. The routes, route_stops and users tables are in the schema but never queried. The optimize route also calls optimizeRoute in utils.ts, which sends a directions request to the Google Maps Directions API with origin and destination both set to currentLocation, the addresses as waypoints, optimize true, driving and imperial units; Google returns routes[0] with waypoint_order and legs.">
  <style>
